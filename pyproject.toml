    { name = "minime289", email = "d351434@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "ddgs>=9.16.1",
    "duckduckgo-search>=8.1.1",
    "fastmcp>=4.1.6",
    "langchain>=1.4.9",
    "langchain-chroma>=1.1.0",
